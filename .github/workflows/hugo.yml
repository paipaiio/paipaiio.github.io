name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.156.0'
          extended: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run regression tests
        run: ./scripts/test.sh

      - name: Build
        run: hugo --minify --destination "$RUNNER_TEMP/hugo-public" --cleanDestinationDir

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/hugo-public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

      - name: Purge Bitiful CDN cache
        run: |
          # 部署完成后刷新缤纷云全站缓存，避免新旧版本页面混跑
          # 密钥存于仓库 Secret: BITIFUL_API_TOKEN（https://console.bitiful.com/apiToken）
          response=$(curl -sS -w "\n%{http_code}" -X POST \
            -H "Authorization: ${{ secrets.BITIFUL_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"type": "directory", "url_list": ["https://blog.paipaiio.com/"]}' \
            https://api.bitiful.com/cdn/cache/refresh)
          body=$(echo "$response" | head -n -1)
          code=$(echo "$response" | tail -n 1)
          echo "Bitiful purge response ($code): $body"
          [ "$code" -ge 200 ] && [ "$code" -lt 300 ]
