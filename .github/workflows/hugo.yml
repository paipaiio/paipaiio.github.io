name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

env:
  # IndexNow 密钥是公开的（站点根目录 static/<key>.txt 需与此一致），用于向 Bing 等搜索引擎推送更新
  INDEXNOW_KEY: 5fe26609426833e35eecda7ca46453f5

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      indexnow_payload: ${{ steps.indexnow.outputs.payload }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.156.0'
          extended: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run regression tests
        run: ./scripts/test.sh

      - name: Build
        run: hugo --minify --destination "$RUNNER_TEMP/hugo-public" --cleanDestinationDir

      - name: Prepare IndexNow submission
        id: indexnow
        # 对比线上旧 sitemap 与本次构建结果，只提交新增、更新或删除的 URL；失败不影响部署
        continue-on-error: true
        run: |
          curl -fsS --max-time 20 https://blog.paipaiio.com/sitemap.xml -o "$RUNNER_TEMP/previous-sitemap.xml" \
            || rm -f "$RUNNER_TEMP/previous-sitemap.xml"
          payload=$(node scripts/indexnow.mjs "$RUNNER_TEMP/previous-sitemap.xml" "$RUNNER_TEMP/hugo-public/sitemap.xml")
          echo "payload=$payload" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/hugo-public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

      - name: Purge Bitiful CDN cache
        run: |
          # 部署完成后刷新缤纷云全站缓存，避免新旧版本页面混跑
          # 密钥存于仓库 Secret: BITIFUL_API_TOKEN（https://console.bitiful.com/apiToken）
          response=$(curl -sS -w "\n%{http_code}" -X POST \
            -H "Authorization: ${{ secrets.BITIFUL_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"type": "directory", "url_list": ["https://blog.paipaiio.com/"]}' \
            https://api.bitiful.com/cdn/cache/refresh)
          body=$(echo "$response" | head -n -1)
          code=$(echo "$response" | tail -n 1)
          echo "Bitiful purge response ($code): $body"
          [ "$code" -ge 200 ] && [ "$code" -lt 300 ]

      - name: Notify IndexNow
        if: needs.build.outputs.indexnow_payload != ''
        # 通知 Bing 等 IndexNow 搜索引擎抓取变化的页面；失败不影响部署
        continue-on-error: true
        env:
          PAYLOAD: ${{ needs.build.outputs.indexnow_payload }}
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" -X POST \
            -H "Content-Type: application/json; charset=utf-8" \
            --data "$PAYLOAD" https://api.indexnow.org/indexnow)
          echo "IndexNow response: $code"
          [ "$code" = 200 ] || [ "$code" = 202 ]
