baseURL = 'https://blog.paipaiio.com'
languageCode = 'zh-cn'
defaultContentLanguage = 'zh'
enableRobotsTXT = true
title = 'paipai’s blog'
theme = "PaperMod"
enableGitInfo = true
buildDrafts = false
buildFuture = false
buildExpired = false

# 构建设置
[pagination]
  pagerSize = 10

########################
# 输出格式（RSS / SEO）
########################
[outputs]
home = ["HTML", "RSS", "JSON"]
section = ["HTML"]
taxonomy = ["HTML"]
term = ["HTML"]

########################
# PaperMod 参数
########################
[params]
author = "MuskZhou"
comments = true

ShowLastMod = true

env = "production"
description = "MuskZhou 的个人博客，记录技术、折腾与思考"

enableSearch = true

ShowToc = true

# 数学公式由 Goldmark 保留源码，KaTeX 在文章页渲染
math = true

# 内容主入口（非常重要）
mainSections = ["posts"]

hideFooter = true

# 主题模式
defaultTheme = "auto"        # auto / light / dark
disableThemeToggle = false

# 阅读体验
ShowReadingTime = true
ShowPostNavLinks = true
ShowBreadCrumbs = true
ShowCodeCopyButtons = true
ShowWordCount = false

# 列表与摘要
hideSummary = false
UseHugoToc = true
TocOpen = false

[params.cover]
hidden = false
linkFullImages = false
hiddenInList = true
hiddenInSingle = false      # 单篇文章页仍然显示封面

[params.fuseOpts]
isCaseSensitive = false
shouldSort = true
location = 0
distance = 100
threshold = 0.3
minMatchCharLength = 2
keys = [
  "title",
  "summary",
  "content",
  "tags",
  "categories"
]

########################
# 首页：ProfileMode
########################
[params.profileMode]
enabled = true
title = "MuskZhou"
subtitle = "写点东西，记录折腾"
imageUrl = "img/avatar.png"
imageTitle = "avatar"
imageWidth = 120
imageHeight = 120

# ProfileMode 按钮（可选）
[[params.profileMode.buttons]]
name = "📚 开始阅读"
url = "/posts/"

[[params.profileMode.buttons]]
name = "👋 关于我"
url = "/about/"

[[params.profileMode.buttons]]
name = "👀 近期活动"
url = "/now/"

[[params.profileMode.buttons]]
name = "⚙️ 小项目"
url = "/projects/"

########################
# 社交链接（右下角 / about 用）
########################
[[params.socialIcons]]
name = "github"
url = "https://github.com/paipaiio"

[[params.socialIcons]]
name = "email"
url = "mailto:MuskZhouMQ@outlook.com"

[[params.socialIcons]]
name = "telegram"
url = "https://t.me/MuskZhouMQ"

[[params.socialIcons]]
name = "x"
url = "https://x.com/paipaiio_dev"

[params.giscus]
repo = "paipaiio/paipaiio.github.io"
repoId = "R_kgDORI5CQg"
category = "Comments"
categoryId = "DIC_kwDORI5CQs4C15eQ"
mapping = "pathname"
strict = "0"
reactionsEnabled = "1"
emitMetadata = "0"
inputPosition = "bottom"
theme = "transparent_dark"
lang = "zh-CN"

########################
# 顶部菜单
########################
[[menu.main]]
name = "首页"
url = "/"
weight = 1

[[menu.main]]
name = "文章"
url = "/posts/"
weight = 2

[[menu.main]]
name = "关于"
url = "/about/"
weight = 3

[[menu.main]]
name = "归档"
url = "/archives/"
weight = 4

[[menu.main]]
name = "标签"
url = "/tags/"
weight = 5

[[menu.main]]
name = "分类"
url = "/categories/"
weight = 6

[[menu.main]]
name = "🔍"
url = "/search/"
weight = 7


########################
# Markdown 渲染（推荐）
########################
[markup]

  [markup.highlight]
  noClasses = false
  codeFences = true
  guessSyntax = true
  lineNos = false

  [markup.goldmark.renderer]
  unsafe = true

[markup.goldmark.extensions]
table = true

[markup.goldmark.extensions.passthrough]
enable = true

[markup.goldmark.extensions.passthrough.delimiters]
block = [['\[', '\]'], ['$$', '$$']]
inline = [['\(', '\)'], ['$', '$']]

[taxonomies]
tag = "tags"
category = "categories"

