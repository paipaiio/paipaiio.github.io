{{- if eq .Type "alert" -}}
  {{- $labels := dict "note" "说明" "tip" "提示" "important" "重要" "warning" "警告" "caution" "注意" -}}
  <blockquote class="alert alert-{{ .AlertType }}">
    <p class="alert-heading">{{ with .AlertTitle }}{{ . }}{{ else }}{{ or (index $labels .AlertType) (title .AlertType) }}{{ end }}</p>
    {{ .Text }}
  </blockquote>
{{- else -}}
  <blockquote>{{ .Text }}</blockquote>
{{- end -}}
