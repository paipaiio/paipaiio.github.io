<div class="giscus" id="comments"></div>
<script id="giscus-client" src="https://giscus.app/client.js" data-repo="{{ site.Params.giscus.repo }}"
  data-repo-id="{{ site.Params.giscus.repoId }}" data-category="{{ site.Params.giscus.category }}"
  data-category-id="{{ site.Params.giscus.categoryId }}" data-mapping="{{ site.Params.giscus.mapping }}"
  data-strict="{{ site.Params.giscus.strict }}" data-reactions-enabled="{{ site.Params.giscus.reactionsEnabled }}"
  data-emit-metadata="{{ site.Params.giscus.emitMetadata }}"
  data-input-position="{{ site.Params.giscus.inputPosition }}" data-theme="{{ site.Params.giscus.theme }}"
  data-lang="{{ site.Params.giscus.lang }}" crossorigin="anonymous" async></script>
<script>
  (() => {
    const origin = 'https://giscus.app';
    const root = document.documentElement;
    const container = document.getElementById('comments');
    const client = document.getElementById('giscus-client');
    let frame = null;
    let ready = false;
    let lastTheme = null;

    const currentTheme = () => root.dataset.theme === 'dark' ? 'transparent_dark' : 'light';
    client.dataset.theme = currentTheme();

    function syncTheme() {
      const currentFrame = container.querySelector('iframe.giscus-frame');
      if (!currentFrame || !currentFrame.contentWindow) return;
      if (currentFrame !== frame) {
        frame = currentFrame;
        ready = false;
        lastTheme = null;
        frame.addEventListener('load', () => {
          ready = true;
          lastTheme = null;
          syncTheme();
        });
      }
      if (!ready) return;
      const theme = currentTheme();
      if (theme === lastTheme) return;
      lastTheme = theme;
      frame.contentWindow.postMessage({ giscus: { setConfig: { theme } } }, origin);
    }

    new MutationObserver(syncTheme).observe(root, { attributes: true, attributeFilter: ['data-theme'] });
    new MutationObserver(syncTheme).observe(container, { childList: true });
    window.addEventListener('message', event => {
      if (event.origin !== origin || !event.data || !event.data.giscus ||
          typeof event.data.giscus !== 'object' || event.data.giscus.error) return;
      const currentFrame = container.querySelector('iframe.giscus-frame');
      if (!currentFrame || event.source !== currentFrame.contentWindow) return;
      syncTheme();
      // A first valid widget message also covers an iframe that loaded early.
      if (!ready) {
        ready = true;
        syncTheme();
      }
    });
    syncTheme();
  })();
</script>
