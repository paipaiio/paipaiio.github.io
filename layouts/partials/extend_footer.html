{{/* 自定义版权栏：hideFooter 只关闭主题默认页脚，此处不受影响 */}}
<footer class="footer site-copyright">
    <span>
        Copyright © {{ now.Year }} paipaiNetWork & Made by MuskZhou
    </span>
</footer>

{{/* 全站氛围层：流动暖色渐变网（Canvas）+ π 水印 + 浮尘（Canvas）+ 纸面颗粒，置于内容之下 */}}
<div class="ambient-bg" aria-hidden="true">
    <canvas id="ambient-mesh"></canvas>
    <div class="ambient-mark">π</div>
    <canvas id="ambient-dust"></canvas>
    <div class="ambient-grain"></div>
</div>
{{/* 走 Hugo 管道输出内容哈希文件名，避免 CDN/浏览器长期缓存旧版脚本 */}}
{{- $ambient := resources.Get "js/ambient.js" | minify | fingerprint }}
<script src="{{ $ambient.RelPermalink }}" defer></script>
